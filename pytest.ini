[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# `-ra` prints a summary of skips/xfails, which matters here because the real
# MiniLM baselines skip cleanly when the model is not cached locally.
addopts = -ra --strict-markers

markers =
    slow: requires downloading or loading the real MiniLM model (deselect with '-m "not slow"')

filterwarnings =
    # Hugging Face emits a symlink warning on Windows without Developer Mode.
    # It is environmental, not a defect in this code.
    ignore::UserWarning:huggingface_hub.*
